name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install overlay dependencies
        working-directory: overlay
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Verify built public disclosure boundary
        run: python3 scripts/verify_public_bundle_boundary.py

      - name: Build overlay
        working-directory: overlay
        run: npm run build

  python-pipeline-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python3 -m pip install pytest

      - name: Run script unit tests
        run: cd scripts && python3 -m unittest discover -p "test_*.py"

      - name: Run model tests
        run: python3 -m pytest scripts/model/tests -q

  validation-skill-tests:
    # The live-validation skill under .codex/skills/test-league-augment-overlay
    # produces the pinned evidence every overlay slice reasons from, and its own
    # test suite ran in no gate. Its scripts are stdlib-only; the recorder tests
    # build and probe real videos, so ffmpeg/ffprobe and lsof must be present.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install recorder test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg lsof

      - name: Verify the documented workflow resolves from the repository root
        run: bash .codex/skills/test-league-augment-overlay/scripts/verify_workflow_cwd.sh

      - name: Run validation-skill unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s .codex/skills/test-league-augment-overlay/scripts -p 'test_*.py'
