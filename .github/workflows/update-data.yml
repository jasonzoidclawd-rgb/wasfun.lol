name: Update Data

on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 06:00 Taipei
    - cron: '0 10 * * *'   # redundant guard against dropped schedule events
  workflow_dispatch:

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Regenerate internal data and export public catalogs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ./scripts/update-data.sh

      - name: Verify active champion roster coverage
        run: python3 scripts/check_roster_coverage.py

      - name: Verify patch-notes publish coverage
        run: python3 scripts/verify_patch_publish.py

      - name: Run data publish tests
        run: npm test

      - name: Build before publishing data
        run: npm run build

      # Publish FIRST. The freshness gate used to run before this step and
      # exit non-zero on drift, which meant a run that acquired good data but
      # still trailed upstream committed nothing — a stale-data detector that
      # blocked its own fix.
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/internal public/data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "data: auto-update $(date -u +%Y-%m-%d)"
          git push

      # Reporting only, and after publishing. Statistics trailing the live
      # game by a patch is the normal steady state for this mode and no longer
      # fails the run; only structural drift (our catalog behind Riot) does.
      - name: Report freshness and manage staleness issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python3 scripts/check_data_freshness.py --json > freshness.json
          check_status=$?
          set -e
          cat freshness.json

          status=$(python3 -c "import json; print(json.load(open('freshness.json'))['status'])")
          structural=$(python3 -c "import json; d=json.load(open('freshness.json'))['structural']; print(f\"{d.get('published_patch') or 'unknown'} vs {d.get('upstream_patch') or 'unknown'}\")")
          statistics=$(python3 -c "import json; d=json.load(open('freshness.json'))['statistics']; print(f\"{d.get('published_patch') or 'unknown'} vs {d.get('upstream_patch') or 'unknown'}\")")

          gh label create data-staleness --color D93F0B --description "Automated data freshness drift" 2>/dev/null || true
          existing=$(gh issue list --label data-staleness --state open --limit 1 --json number --jq '.[0].number')

          if [ "$status" = "fresh" ] || [ "$status" = "statistics_behind" ]; then
            echo "Publishable state: $status (structural $structural | statistics $statistics)"
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Recovered: $status. Structural $structural. Statistics $statistics. Run: $RUN_URL"
            fi
            exit 0
          fi

          if [ "$status" = "unknown" ]; then
            title="Data freshness is unknown (structural $structural)"
            body="UNKNOWN: structural=$structural statistics=$statistics. Could not determine freshness. Run: $RUN_URL"
          else
            title="Structural data is stale (structural $structural)"
            body="STRUCTURAL_STALE: structural=$structural statistics=$statistics. The published catalog is behind Riot's live patch. Run: $RUN_URL"
          fi

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label data-staleness --body "$body"
          fi

          exit "$check_status"

      # Vercel auto-deploys on push via GitHub integration — no explicit step needed

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Surface silent scrape decay: reuse a single open issue rather than spamming.
          gh label create data-staleness --color D93F0B --description "Automated data refresh failed" 2>/dev/null || true
          existing=$(gh issue list --label data-staleness --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Data update run failed again: $RUN_URL"
          else
            gh issue create \
              --title "Data update workflow failed — data may be going stale" \
              --label data-staleness \
              --body "The daily \`update-data\` run failed, so \`public/data/\` was not refreshed. Investigate before the published patch data drifts. Run: $RUN_URL"
          fi
